<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Genially → PDF</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --surface: #ffffff;
      --surface-muted: #f0ece3;
      --ink: #171614;
      --ink-muted: #625d54;
      --border: #e3ddd1;
      --accent: #3d35d8;
      --accent-hover: #2f28b8;
      --accent-soft: #ebeaff;
      --success: #0d7a4f;
      --success-soft: #e6f6ee;
      --danger: #c43131;
      --danger-soft: #fdecec;
      --radius: 14px;
      --shadow: 0 8px 28px rgba(23, 22, 20, 0.06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 28px 20px 56px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #3d35d8 0%, #6d5dfc 100%);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 18px;
      box-shadow: 0 6px 16px rgba(61, 53, 216, 0.25);
    }

    h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 750;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 2px 0 0;
      font-size: 0.9rem;
      color: var(--ink-muted);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 20px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: stretch;
      flex-wrap: wrap;
    }

    .url-input {
      flex: 1 1 360px;
      padding: 13px 16px;
      font-size: 0.98rem;
      border: 1.5px solid var(--border);
      border-radius: 11px;
      background: #fcfbf8;
      color: var(--ink);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .url-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
      background: #fff;
    }

    .btn {
      border: 0;
      border-radius: 11px;
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: 650;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: transform 0.08s, background 0.15s, opacity 0.15s;
      white-space: nowrap;
    }

    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }

    .btn-success {
      background: var(--success);
      color: #fff;
    }
    .btn-success:hover:not(:disabled) { background: #0a633f; }

    .btn-ghost {
      background: var(--surface-muted);
      color: var(--ink);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover:not(:disabled) { background: #e6e0d4; }

    .btn-danger-soft {
      background: var(--danger-soft);
      color: var(--danger);
    }
    .btn-danger-soft:hover:not(:disabled) { background: #fad5d5; }

    .options-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      font-size: 0.88rem;
      color: var(--ink-muted);
    }

    .options-group {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    label.inline {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      color: var(--ink);
      font-weight: 500;
    }

    select {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fcfbf8;
      color: var(--ink);
      font-size: 0.88rem;
    }

    .example-chip {
      border: 1px dashed #c7c0b2;
      background: transparent;
      color: var(--ink-muted);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .example-chip:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    .hidden { display: none !important; }

    .alert-error {
      background: var(--danger-soft);
      color: var(--danger);
      border: 1px solid #f4c2c2;
      border-radius: 11px;
      padding: 12px 16px;
      margin-top: 14px;
      font-size: 0.92rem;
      font-weight: 500;
    }

    /* Progress card */
    .progress-layout {
      display: grid;
      grid-template-columns: 1fr 220px;
      gap: 18px;
      align-items: center;
    }

    @media (max-width: 720px) {
      .progress-layout { grid-template-columns: 1fr; }
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 8px;
    }

    .progress-title {
      font-weight: 700;
      font-size: 1rem;
    }

    .progress-pct {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
    }

    .bar-track {
      width: 100%;
      height: 11px;
      background: var(--surface-muted);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3d35d8, #6d5dfc);
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .progress-msg {
      font-size: 0.9rem;
      color: var(--ink-muted);
      margin-bottom: 12px;
    }

    .thumb-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-muted);
      overflow: hidden;
      display: grid;
      place-items: center;
      color: var(--ink-muted);
      font-size: 0.8rem;
    }

    .thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Viewer card */
    .viewer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .viewer-meta h2 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 750;
    }

    .badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .badge {
      font-size: 0.8rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--surface-muted);
      color: var(--ink-muted);
    }

    .badge.ok {
      background: var(--success-soft);
      color: var(--success);
    }

    .viewer-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pdf-frame-wrap {
      width: 100%;
      height: 74vh;
      min-height: 520px;
      border-radius: 11px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #2b2a28;
    }

    .pdf-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* History */
    .history-title {
      margin: 0 0 12px;
      font-size: 1rem;
      font-weight: 700;
    }

    .history-list {
      display: grid;
      gap: 10px;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: #fcfbf8;
      flex-wrap: wrap;
    }

    .history-info {
      min-width: 220px;
      flex: 1;
    }

    .history-name {
      font-weight: 650;
      font-size: 0.94rem;
    }

    .history-sub {
      font-size: 0.82rem;
      color: var(--ink-muted);
    }

    .history-btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-sm {
      padding: 7px 12px;
      font-size: 0.84rem;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="logo">G→P</div>
        <div>
          <h1>Genially a PDF</h1>
          <p class="subtitle">Convierte presentaciones públicas de Genially en un PDF limpio, visible y descargable.</p>
        </div>
      </div>
    </header>

    <section class="card">
      <form id="convert-form">
        <div class="input-row">
          <input
            id="url-input"
            class="url-input"
            type="url"
            placeholder="Pega aquí el link del Genially (ej. https://view.genially.com/...)"
            required
          />
          <button id="submit-btn" class="btn btn-primary" type="submit">
            Convertir a PDF
          </button>
        </div>

        <div class="options-bar">
          <div class="options-group">
            <label class="inline">
              Calidad:
              <select id="quality-select">
                <option value="2" selected>Alta (2× nítida, recomendada)</option>
                <option value="1">Rápida (1× liviana)</option>
                <option value="3">Ultra (3× máxima)</option>
              </select>
            </label>
            <label class="inline">
              <input id="searchable-checkbox" type="checkbox" checked />
              Texto buscable (Ctrl+F)
            </label>
          </div>
          <button id="example-btn" class="example-chip" type="button">
            Usar link de clase de ejemplo
          </button>
        </div>
      </form>

      <div id="error-box" class="alert-error hidden"></div>
    </section>

    <section id="progress-card" class="card hidden">
      <div class="progress-layout">
        <div>
          <div class="progress-header">
            <span id="progress-title" class="progress-title">Preparando conversión...</span>
            <span id="progress-pct" class="progress-pct">0%</span>
          </div>
          <div class="bar-track">
            <div id="bar-fill" class="bar-fill"></div>
          </div>
          <div id="progress-msg" class="progress-msg">Iniciando navegador...</div>
          <button id="cancel-btn" class="btn btn-danger-soft btn-sm" type="button">
            Cancelar conversión
          </button>
        </div>
        <div class="thumb-box">
          <span id="thumb-placeholder">Vista previa en vivo</span>
          <img id="thumb-img" class="hidden" alt="Diapositiva actual" />
        </div>
      </div>
    </section>

    <section id="viewer-card" class="card hidden">
      <div class="viewer-header">
        <div class="viewer-meta">
          <h2 id="viewer-title">Presentación</h2>
          <div class="badges" id="viewer-badges"></div>
        </div>
        <div class="viewer-actions">
          <a id="open-tab-btn" class="btn btn-ghost" href="#" target="_blank" rel="noopener">
            Abrir en pestaña
          </a>
          <a id="download-btn" class="btn btn-success" href="#" download>
            Descargar PDF
          </a>
        </div>
      </div>
      <div class="pdf-frame-wrap">
        <iframe id="pdf-frame" class="pdf-frame" title="Visor de PDF"></iframe>
      </div>
    </section>

    <section id="history-card" class="card hidden">
      <h3 class="history-title">PDFs convertidos recientemente (guardados en <code>output/</code>)</h3>
      <div id="history-list" class="history-list"></div>
    </section>
  </div>

  <script>
    const EXAMPLE_URL = "https://view.genially.com/67c88cee24ddcabc9eff7571";
    const form = document.getElementById("convert-form");
    const urlInput = document.getElementById("url-input");
    const submitBtn = document.getElementById("submit-btn");
    const qualitySelect = document.getElementById("quality-select");
    const searchableCheckbox = document.getElementById("searchable-checkbox");
    const exampleBtn = document.getElementById("example-btn");
    const errorBox = document.getElementById("error-box");

    const progressCard = document.getElementById("progress-card");
    const progressTitle = document.getElementById("progress-title");
    const progressPct = document.getElementById("progress-pct");
    const barFill = document.getElementById("bar-fill");
    const progressMsg = document.getElementById("progress-msg");
    const cancelBtn = document.getElementById("cancel-btn");
    const thumbImg = document.getElementById("thumb-img");
    const thumbPlaceholder = document.getElementById("thumb-placeholder");

    const viewerCard = document.getElementById("viewer-card");
    const viewerTitle = document.getElementById("viewer-title");
    const viewerBadges = document.getElementById("viewer-badges");
    const openTabBtn = document.getElementById("open-tab-btn");
    const downloadBtn = document.getElementById("download-btn");
    const pdfFrame = document.getElementById("pdf-frame");

    const historyCard = document.getElementById("history-card");
    const historyList = document.getElementById("history-list");

    let activeEventSource = null;
    let activeJobId = null;
    let lastThumbVersion = 0;

    function formatBytes(bytes) {
      if (!bytes) return "0 KB";
      const mb = bytes / (1024 * 1024);
      return mb >= 1 ? `${mb.toFixed(2)} MB` : `${(bytes / 1024).toFixed(0)} KB`;
    }

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.remove("hidden");
    }

    function clearError() {
      errorBox.classList.add("hidden");
      errorBox.textContent = "";
    }

    function setBusy(busy) {
      submitBtn.disabled = busy;
      urlInput.disabled = busy;
      submitBtn.textContent = busy ? "Convirtiendo..." : "Convertir a PDF";
    }

    function showResult(result) {
      viewerTitle.textContent = result.title || "Presentación PDF";
      viewerBadges.innerHTML = "";
      const items = [
        { text: "PDF listo", ok: true },
        { text: `${result.page_count} páginas` },
        { text: formatBytes(result.size_bytes) },
        { text: `${result.slide_width}×${result.slide_height}px` },
        { text: `${result.duration_seconds}s` },
      ];
      for (const item of items) {
        const span = document.createElement("span");
        span.className = item.ok ? "badge ok" : "badge";
        span.textContent = item.text;
        viewerBadges.appendChild(span);
      }

      const inlineUrl = `${result.pdf_url}?t=${Date.now()}`;
      pdfFrame.src = inlineUrl;
      openTabBtn.href = inlineUrl;
      downloadBtn.href = result.download_url;
      downloadBtn.setAttribute("download", result.filename || "presentacion.pdf");
      viewerCard.classList.remove("hidden");
      viewerCard.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    async function loadHistory() {
      try {
        const res = await fetch("/api/history");
        if (!res.ok) return;
        const items = await res.json();
        if (!items.length) {
          historyCard.classList.add("hidden");
          return;
        }
        historyCard.classList.remove("hidden");
        historyList.innerHTML = "";
        for (const item of items) {
          const row = document.createElement("div");
          row.className = "history-item";

          const info = document.createElement("div");
          info.className = "history-info";
          const name = document.createElement("div");
          name.className = "history-name";
          name.textContent = item.title || item.filename;
          const sub = document.createElement("div");
          sub.className = "history-sub";
          sub.textContent = `${item.page_count} páginas · ${formatBytes(item.size_bytes)} · ${item.source_url}`;
          info.appendChild(name);
          info.appendChild(sub);

          const btns = document.createElement("div");
          btns.className = "history-btns";

          const viewBtn = document.createElement("button");
          viewBtn.type = "button";
          viewBtn.className = "btn btn-ghost btn-sm";
          viewBtn.textContent = "Ver PDF";
          viewBtn.onclick = () => showResult(item);

          const dlLink = document.createElement("a");
          dlLink.className = "btn btn-success btn-sm";
          dlLink.textContent = "Descargar";
          dlLink.href = item.download_url;
          dlLink.setAttribute("download", item.filename || "presentacion.pdf");

          const delBtn = document.createElement("button");
          delBtn.type = "button";
          delBtn.className = "btn btn-danger-soft btn-sm";
          delBtn.textContent = "Eliminar";
          delBtn.onclick = async () => {
            await fetch(`/api/history/${item.job_id}`, { method: "DELETE" });
            loadHistory();
          };

          btns.appendChild(viewBtn);
          btns.appendChild(dlLink);
          btns.appendChild(delBtn);

          row.appendChild(info);
          row.appendChild(btns);
          historyList.appendChild(row);
        }
      } catch (_) {}
    }

    function updateProgress(data) {
      progressCard.classList.remove("hidden");
      progressTitle.textContent = data.title ? `Convirtiendo: ${data.title}` : "Convirtiendo presentación...";
      const pct = data.percent || 0;
      progressPct.textContent = `${pct}%`;
      barFill.style.width = `${pct}%`;
      progressMsg.textContent = data.message || "Procesando...";

      if (data.thumb_version && data.thumb_version !== lastThumbVersion) {
        lastThumbVersion = data.thumb_version;
        thumbImg.src = `/api/jobs/${data.job_id}/thumb?v=${data.thumb_version}`;
        thumbImg.classList.remove("hidden");
        thumbPlaceholder.classList.add("hidden");
      }
    }

    function stopStream() {
      if (activeEventSource) {
        activeEventSource.close();
        activeEventSource = null;
      }
    }

    exampleBtn.addEventListener("click", () => {
      urlInput.value = EXAMPLE_URL;
      urlInput.focus();
    });

    cancelBtn.addEventListener("click", async () => {
      if (!activeJobId) return;
      cancelBtn.disabled = true;
      await fetch(`/api/jobs/${activeJobId}/cancel`, { method: "POST" });
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearError();
      stopStream();

      const url = urlInput.value.trim();
      if (!url) {
        showError("Pega un enlace de Genially para empezar.");
        return;
      }

      setBusy(true);
      lastThumbVersion = 0;
      thumbImg.classList.add("hidden");
      thumbPlaceholder.classList.remove("hidden");
      cancelBtn.disabled = false;
      barFill.style.width = "3%";
      progressPct.textContent = "3%";
      progressTitle.textContent = "Iniciando conversión...";
      progressMsg.textContent = "Preparando navegador...";
      progressCard.classList.remove("hidden");

      try {
        const res = await fetch("/api/convert", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            url,
            scale_factor: parseInt(qualitySelect.value, 10) || 2,
            searchable_text: searchableCheckbox.checked,
          }),
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || "No se pudo iniciar la conversión.");
        }

        activeJobId = data.job_id;
        updateProgress(data);

        activeEventSource = new EventSource(`/api/jobs/${activeJobId}/events`);
        activeEventSource.onmessage = (event) => {
          const job = JSON.parse(event.data);
          updateProgress(job);

          if (job.status === "done" && job.result) {
            stopStream();
            setBusy(false);
            progressCard.classList.add("hidden");
            showResult(job.result);
            loadHistory();
          } else if (job.status === "error") {
            stopStream();
            setBusy(false);
            progressCard.classList.add("hidden");
            showError(job.error || "Error al convertir la presentación.");
          } else if (job.status === "cancelled") {
            stopStream();
            setBusy(false);
            progressCard.classList.add("hidden");
            showError("Conversión cancelada.");
          }
        };

        activeEventSource.onerror = async () => {
          stopStream();
          // Respaldo: verificar estado final si se cortó SSE
          try {
            const check = await fetch(`/api/jobs/${activeJobId}`);
            if (check.ok) {
              const job = await check.json();
              if (job.status === "done" && job.result) {
                setBusy(false);
                progressCard.classList.add("hidden");
                showResult(job.result);
                loadHistory();
                return;
              }
              if (job.status === "error") {
                setBusy(false);
                progressCard.classList.add("hidden");
                showError(job.error || "Error al convertir.");
                return;
              }
            }
          } catch (_) {}
          setBusy(false);
        };
      } catch (err) {
        setBusy(false);
        progressCard.classList.add("hidden");
        showError(err.message || "Error inesperado.");
      }
    });

    loadHistory();
  </script>
</body>
</html>
